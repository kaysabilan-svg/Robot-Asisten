name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tulis file proyek
        run: |
          cat > settings.gradle <<'RBEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Robo'
          include ':app'
          RBEOF
          cat > build.gradle <<'RBEOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          RBEOF
          cat > gradle.properties <<'RBEOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          RBEOF
          mkdir -p app
          cat > app/build.gradle <<'RBEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.kay.robo'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.kay.robo'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          RBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'RBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:label="Robo"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".RoboService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/MainActivity.kt <<'RBEOF'
          package com.kay.robo

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var tts: TextToSpeech? = null
              private var recognizer: SpeechRecognizer? = null
              private var pending = false
              private var pendingBg = false
              private var awaitOverlay = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (request.url.scheme == "file") return false
                          openExternal(request.url.toString())
                          return true
                      }
                  }
                  web.addJavascriptInterface(Bridge(), "Native")
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.let { t ->
                              Voice.apply(this, t)
                              t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(id: String?) {}
                                  override fun onDone(id: String?) { js("window.onSpeakDone&&window.onSpeakDone()") }
                                  @Deprecated("Deprecated in Java")
                                  override fun onError(id: String?) { js("window.onSpeakDone&&window.onSpeakDone()") }
                              })
                          }
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              override fun onResume() {
                  super.onResume()
                  if (awaitOverlay) {
                      awaitOverlay = false
                      if (Settings.canDrawOverlays(this)) startBackground() else js("window.onBgState&&window.onBgState(false)")
                  }
                  js("window.onBgState&&window.onBgState(" + RoboService.active + ",'init')")
              }

              private fun js(code: String) {
                  runOnUiThread { web.evaluateJavascript(code, null) }
              }

              private fun openExternal(url: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                  }
              }

              private fun micOk(): Boolean =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun startBackground() {
                  val need = ArrayList<String>()
                  if (!micOk()) need.add(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) {
                      pendingBg = true
                      requestPermissions(need.toTypedArray(), 2)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      awaitOverlay = true
                      js("window.onBgState&&window.onBgState(false,'overlay')")
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  startForegroundService(Intent(this, RoboService::class.java))
                  js("window.onBgState&&window.onBgState(true)")
              }

              private fun startListening() {
                  if (!micOk()) {
                      pending = true
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      js("window.onNativeError&&window.onNativeError('unavailable')")
                      return
                  }
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) { js("window.onNativeStart&&window.onNativeStart()") }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(e: Int) {
                          if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                              js("window.onNativeError&&window.onNativeError('denied')")
                          } else {
                              js("window.onNativeEnd&&window.onNativeEnd()")
                          }
                      }
                      override fun onResults(b: Bundle?) {
                          val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t != null) js("window.onNativeResult&&window.onNativeResult(" + JSONObject.quote(t) + ")")
                          js("window.onNativeEnd&&window.onNativeEnd()")
                      }
                      override fun onPartialResults(b: Bundle?) {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "id-ID")
                  r.startListening(i)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 2 && pendingBg) {
                      pendingBg = false
                      if (micOk()) startBackground() else js("window.onBgState&&window.onBgState(false,'denied')")
                      return
                  }
                  if (pending) {
                      pending = false
                      if (micOk()) startListening() else js("window.onNativeError&&window.onNativeError('denied')")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  tts?.shutdown()
                  recognizer?.destroy()
                  web.destroy()
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun speak(t: String) {
                      runOnUiThread {
                          tts?.let {
                              Voice.apply(this@MainActivity, it)
                              it.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u")
                          }
                      }
                  }

                  @JavascriptInterface
                  fun openUrl(u: String) {
                      runOnUiThread { openExternal(u) }
                  }

                  @JavascriptInterface
                  fun listen() {
                      runOnUiThread {
                          if (RoboService.active) {
                              js("window.onNativeError&&window.onNativeError('bg')")
                          } else {
                              startListening()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun stop() {
                      runOnUiThread {
                          try {
                              recognizer?.cancel()
                          } catch (e: Exception) {
                          }
                      }
                  }

                  @JavascriptInterface
                  fun openApp(q: String): String {
                      val hit = Apps.find(this@MainActivity, q) ?: return ""
                      runOnUiThread { Apps.launch(this@MainActivity, hit.second) }
                      return hit.first
                  }

                  @JavascriptInterface
                  fun voices(): String = JSONArray(Voice.list(tts)).toString()

                  @JavascriptInterface
                  fun getVoice(): String =
                      JSONObject().put("voice", Voice.voiceName(this@MainActivity)).put("style", Voice.style(this@MainActivity)).toString()

                  @JavascriptInterface
                  fun setVoice(v: String, s: String) {
                      Voice.save(this@MainActivity, v, s)
                  }

                  @JavascriptInterface
                  fun bgActive(): Boolean = RoboService.active

                  @JavascriptInterface
                  fun bgToggle() {
                      runOnUiThread {
                          if (RoboService.active) {
                              stopService(Intent(this@MainActivity, RoboService::class.java))
                              js("window.onBgState&&window.onBgState(false,'off')")
                          } else {
                              startBackground()
                          }
                      }
                  }
              }
          }
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/Apps.kt <<'RBEOF'
          package com.kay.robo

          import android.content.Context
          import android.content.Intent
          import java.util.Locale

          object Apps {
              fun norm(s: String): String {
                  var x = s.lowercase(Locale.ROOT).replace(Regex("[^a-z0-9]+"), " ").trim()
                  x = x.replace(Regex("\\bwa\\b"), "whatsapp")
                      .replace(Regex("\\b(bisnis|bisnes)\\b"), "business")
                      .replace(Regex("\\big\\b"), "instagram")
                      .replace(Regex("\\byt\\b"), "youtube")
                      .replace(Regex("\\bfb\\b"), "facebook")
                      .replace(Regex("\\btokped\\b"), "tokopedia")
                      .replace(Regex("\\b(email|e mail|surel)\\b"), "gmail")
                  return x.replace(Regex("\\s+"), " ").trim()
              }

              fun find(ctx: Context, q: String): Pair<String, String>? {
                  val query = norm(q)
                  if (query.isEmpty()) return null
                  val toks = query.split(" ")
                  val pm = ctx.packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  var best: Pair<String, String>? = null
                  var top = 0
                  for (ri in pm.queryIntentActivities(main, 0)) {
                      val label = ri.loadLabel(pm).toString()
                      val pkg = ri.activityInfo.packageName
                      val n = norm(label)
                      if (n.isEmpty()) continue
                      val sc = when {
                          pkg.equals(q.trim(), true) -> 2000
                          n == query -> 1000
                          n.contains(query) -> 500 - n.length
                          toks.all { n.contains(it) } -> 300 - n.length
                          n.length >= 3 && query.contains(n) -> 200 - (query.length - n.length)
                          else -> 0
                      }
                      if (sc > top) {
                          top = sc
                          best = Pair(label, pkg)
                      }
                  }
                  return best
              }

              fun launch(ctx: Context, pkg: String): Boolean {
                  return try {
                      val i = ctx.packageManager.getLaunchIntentForPackage(pkg) ?: return false
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/Voice.kt <<'RBEOF'
          package com.kay.robo

          import android.content.Context
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          object Voice {
              private fun prefs(c: Context) = c.getSharedPreferences("robo", Context.MODE_PRIVATE)

              fun style(c: Context): String = prefs(c).getString("style", "robot") ?: "robot"

              fun voiceName(c: Context): String = prefs(c).getString("voice", "") ?: ""

              fun save(c: Context, voice: String, style: String) {
                  prefs(c).edit().putString("voice", voice).putString("style", style).apply()
              }

              fun apply(c: Context, t: TextToSpeech) {
                  t.setLanguage(Locale("id", "ID"))
                  val name = voiceName(c)
                  if (name.isNotEmpty()) {
                      try {
                          t.voices?.firstOrNull { it.name == name }?.let { t.setVoice(it) }
                      } catch (e: Exception) {
                      }
                  }
                  val p = when (style(c)) {
                      "normal" -> Pair(1.0f, 1.0f)
                      "ceria" -> Pair(1.4f, 1.1f)
                      "imut" -> Pair(1.8f, 1.15f)
                      else -> Pair(0.55f, 0.9f)
                  }
                  t.setPitch(p.first)
                  t.setSpeechRate(p.second)
              }

              fun list(t: TextToSpeech?): List<String> {
                  return try {
                      t?.voices
                          ?.filter { (it.locale.language == "in" || it.locale.language == "id") && !it.features.contains("notInstalled") }
                          ?.map { it.name }
                          ?.sorted() ?: emptyList()
                  } catch (e: Exception) {
                      emptyList()
                  }
              }
          }
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/RoboService.kt <<'RBEOF'
          package com.kay.robo

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.Icon
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import java.util.Locale

          class RoboService : Service() {
              companion object {
                  @Volatile
                  var active = false
              }

              private val h = Handler(Looper.getMainLooper())
              private var rec: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var speaking = false
              private var running = false
              private var sayId = 0
              private var overlay: View? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startFg()
                  if (!running) {
                      running = true
                      active = true
                      showOverlay()
                      tts = TextToSpeech(this) { st ->
                          ttsReady = st == TextToSpeech.SUCCESS
                          if (ttsReady) {
                              tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(id: String?) {}
                                  override fun onDone(id: String?) { h.post { speaking = false; listen() } }
                                  @Deprecated("Deprecated in Java")
                                  override fun onError(id: String?) { h.post { speaking = false; listen() } }
                              })
                              say("Robo aktif. Silakan ucapkan perintah.")
                          } else {
                              listen()
                          }
                      }
                  }
                  return START_STICKY
              }

              private fun startFg() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("robo", "Robo aktif", NotificationManager.IMPORTANCE_LOW))
                  nm.createNotificationChannel(NotificationChannel("robo_open", "Buka aplikasi", NotificationManager.IMPORTANCE_HIGH))
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, RoboService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val open = PendingIntent.getActivity(this, 2, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val action = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel), "Matikan", stop
                  ).build()
                  val n = Notification.Builder(this, "robo")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Robo aktif")
                      .setContentText("Mendengarkan perintah suara…")
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(action)
                      .build()
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun showOverlay() {
                  if (!Settings.canDrawOverlays(this)) return
                  val d = resources.displayMetrics.density
                  val size = (14 * d).toInt()
                  val v = View(this)
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(0xCC22C55E.toInt())
                  v.background = bg
                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.END
                  lp.x = (8 * d).toInt()
                  lp.y = (80 * d).toInt()
                  try {
                      (getSystemService(WINDOW_SERVICE) as WindowManager).addView(v, lp)
                      overlay = v
                  } catch (e: Exception) {
                  }
              }

              private fun say(t: String) {
                  val s = tts
                  if (s == null || !ttsReady) {
                      listen()
                      return
                  }
                  speaking = true
                  val my = ++sayId
                  try {
                      rec?.cancel()
                  } catch (e: Exception) {
                  }
                  Voice.apply(this, s)
                  s.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u")
                  h.postDelayed({
                      if (speaking && my == sayId) {
                          speaking = false
                          listen()
                      }
                  }, t.length * 130L + 4000L)
              }

              private fun listen() {
                  if (!running || speaking) return
                  h.post {
                      if (!running || speaking) return@post
                      try {
                          rec?.destroy()
                          val r = SpeechRecognizer.createSpeechRecognizer(this)
                          rec = r
                          r.setRecognitionListener(object : RecognitionListener {
                              override fun onReadyForSpeech(p: Bundle?) {}
                              override fun onBeginningOfSpeech() {}
                              override fun onRmsChanged(v: Float) {}
                              override fun onBufferReceived(b: ByteArray?) {}
                              override fun onEndOfSpeech() {}
                              override fun onError(e: Int) {
                                  if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                                      stopSelf()
                                      return
                                  }
                                  val wait = if (e == SpeechRecognizer.ERROR_RECOGNIZER_BUSY) 1500L else 400L
                                  h.postDelayed({ listen() }, wait)
                              }
                              override fun onResults(b: Bundle?) {
                                  val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                                  if (t != null) handle(t)
                                  if (!speaking) h.postDelayed({ listen() }, 300)
                              }
                              override fun onPartialResults(b: Bundle?) {}
                              override fun onEvent(t: Int, b: Bundle?) {}
                          })
                          r.startListening(
                              Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                                  .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                  .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "id-ID")
                          )
                      } catch (e: Exception) {
                          h.postDelayed({ listen() }, 2000L)
                      }
                  }
              }

              private fun handle(raw: String) {
                  val t = raw.lowercase(Locale.ROOT).trim().replace(Regex("^(halo robo|hai robo|robo)\\b[, ]*"), "")
                  val open = Regex("^(?:buka|bukakan|open|jalankan|masuk ke)\\s+(.+)").find(t)
                  val search = Regex("^(?:cari|carikan|googling)\\s+(.+)").find(t)
                  val play = Regex("^(?:putar|setel|play)\\s+(.+)").find(t)
                  when {
                      open != null -> {
                          val q = open.groupValues[1].replace(Regex("^(aplikasi|app)\\s+"), "").trim()
                          val hit = Apps.find(this, q)
                          if (hit == null) {
                              say("Aku tidak menemukan aplikasi $q di HP ini.")
                              return
                          }
                          Apps.launch(this, hit.second)
                          hint(hit.first, hit.second)
                          say("Aplikasi ${hit.first} terbuka.")
                      }
                      search != null -> {
                          view("https://www.google.com/search?q=" + Uri.encode(search.groupValues[1]))
                          say("Mencari ${search.groupValues[1]}.")
                      }
                      play != null -> {
                          view("https://www.youtube.com/results?search_query=" + Uri.encode(play.groupValues[1]))
                          say("Memutar ${play.groupValues[1]} di YouTube.")
                      }
                      t.contains("matikan robo") || t == "berhenti mendengarkan" -> {
                          say("Robo dimatikan.")
                          h.postDelayed({ stopSelf() }, 1800L)
                      }
                  }
              }

              private fun view(u: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                  }
              }

              private fun hint(label: String, pkg: String) {
                  val li = packageManager.getLaunchIntentForPackage(pkg) ?: return
                  val pi = PendingIntent.getActivity(this, 5, li, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(this, "robo_open")
                      .setSmallIcon(android.R.drawable.ic_menu_send)
                      .setContentTitle("Buka $label")
                      .setContentText("Ketuk jika aplikasi belum terbuka")
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .setTimeoutAfter(8000L)
                      .build()
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(3, n)
              }

              override fun onDestroy() {
                  running = false
                  active = false
                  h.removeCallbacksAndMessages(null)
                  try {
                      rec?.destroy()
                  } catch (e: Exception) {
                  }
                  tts?.shutdown()
                  overlay?.let {
                      try {
                          (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(it)
                      } catch (e: Exception) {
                      }
                  }
                  super.onDestroy()
              }
          }
          RBEOF
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'RBEOF'
          <!DOCTYPE html>
          <html lang="id">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>Robo — Robot Asisten</title>
          <style>
          :root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6784;--ln:#dde3f0;--ac:#2563eb;--rc:#38bdf8;--sc:#0b1226;--sky1:#dbeafe;--sky2:#f4f6fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--card:#151c33;--tx:#e8ecf8;--mut:#9aa6c7;--ln:#26304f;--ac:#60a5fa;--sky1:#1b2a52;--sky2:#0b1020;color-scheme:dark}}
          :root[data-theme="dark"]{--bg:#0b1020;--card:#151c33;--tx:#e8ecf8;--mut:#9aa6c7;--ln:#26304f;--ac:#60a5fa;--sky1:#1b2a52;--sky2:#0b1020;color-scheme:dark}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          *{box-sizing:border-box}
          body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
          .wrap{max-width:560px;margin:0 auto;padding:16px 14px 28px}
          h1{font-size:22px;margin:4px 0 12px}h1 small{font-size:13px;color:var(--mut);font-weight:400;margin-left:6px}
          .stage{position:relative;height:250px;border:1px solid var(--ln);border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2))}
          .ground{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--ln)}
          .bubble{position:absolute;top:10px;left:10px;right:10px;background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:8px 12px;font-size:14px;line-height:1.4}
          .robot{position:absolute;bottom:20px;left:50%;margin-left:-55px;width:110px;height:170px}
          .rb{position:relative;width:110px;height:170px;transform-origin:50% 100%}
          .rb.idle{animation:bob 2.4s ease-in-out infinite}
          .rb.walk{animation:hop .4s infinite alternate}
          .rb.dance{animation:dance .5s infinite alternate}
          .rb.jump{animation:jump .6s ease-out}
          .ant{position:absolute;left:53px;top:0;width:4px;height:16px;background:var(--mut)}
          .ant i{position:absolute;left:-4px;top:-8px;width:12px;height:12px;border-radius:50%;background:var(--rc);box-shadow:0 0 8px var(--rc)}
          .head{position:absolute;top:14px;left:13px;width:84px;height:62px;border-radius:20px;background:var(--rc)}
          .face{position:absolute;inset:7px;border-radius:14px;background:var(--sc);display:flex;align-items:center;justify-content:center;gap:14px}
          .eye{width:14px;height:18px;border-radius:50%;background:#7dd3fc;animation:blink 4s infinite}
          .mouth{position:absolute;bottom:6px;left:50%;width:20px;height:4px;margin-left:-10px;border-radius:4px;background:#7dd3fc}
          .talk .mouth{animation:talk .22s infinite alternate}
          .listen .eye{background:#4ade80;box-shadow:0 0 8px #4ade80}
          .body{position:absolute;top:80px;left:22px;width:66px;height:52px;border-radius:16px;background:var(--rc);filter:brightness(.88)}
          .chest{position:absolute;left:25px;top:18px;width:16px;height:16px;border-radius:50%;background:#fde68a;box-shadow:0 0 10px #fde68a}
          .arm{position:absolute;top:86px;width:12px;height:40px;border-radius:8px;background:var(--rc);filter:brightness(.78);transform-origin:50% 6px}
          .arm.l{left:6px}.arm.r{right:6px}
          .leg{position:absolute;top:130px;width:16px;height:34px;border-radius:8px;background:#475569;transform-origin:50% 6px}
          .leg.l{left:30px}.leg.r{right:30px}
          .walk .leg.l,.walk .arm.r{animation:step .4s infinite alternate}
          .walk .leg.r,.walk .arm.l{animation:step .4s infinite alternate-reverse}
          .dance .arm.l{animation:wl .25s infinite alternate}
          .dance .arm.r{animation:wr .25s infinite alternate}
          @keyframes bob{50%{transform:translateY(-4px)}}
          @keyframes hop{to{transform:translateY(-6px)}}
          @keyframes dance{from{transform:rotate(-8deg)}to{transform:rotate(8deg) translateY(-12px)}}
          @keyframes jump{40%{transform:translateY(-70px)}}
          @keyframes step{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
          @keyframes wl{from{transform:rotate(120deg)}to{transform:rotate(165deg)}}
          @keyframes wr{from{transform:rotate(-165deg)}to{transform:rotate(-120deg)}}
          @keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
          @keyframes talk{from{height:4px}to{height:12px}}
          .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px}
          .chips button{flex:none;white-space:nowrap;font-size:13px;padding:8px 12px;border-radius:999px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
          .log{height:170px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:8px 0}
          .m{max-width:85%;padding:8px 12px;border-radius:14px;font-size:14px;line-height:1.4}
          .m.u{align-self:flex-end;background:var(--ac);color:#fff}
          .m.r{align-self:flex-start;background:var(--card);border:1px solid var(--ln)}
          .m.r a{color:var(--ac);font-weight:600}
          .m.r a.btn{display:inline-block;background:var(--ac);color:#fff;padding:8px 14px;border-radius:10px;text-decoration:none}
          .bar{display:flex;gap:8px}
          .bar input{flex:1;min-width:0;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
          .bar button{min-height:44px;min-width:44px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:16px}
          .bar #go{background:var(--ac);border-color:var(--ac);color:#fff;padding:0 14px}
          .bar #mic.on{background:#ef4444;border-color:#ef4444}
          .set{display:flex;flex-direction:column;gap:8px;margin:4px 0 8px}
          .set .row{display:flex;gap:8px}
          .set select{flex:1;min-width:0;font-size:14px;padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx)}
          .set button{min-height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font-size:14px;padding:0 12px}
          #bg.on{background:#16a34a;border-color:#16a34a;color:#fff}
          [hidden]{display:none!important}
          </style>
          </head>
          <body>
          <main class="wrap">
          <h1>Robo <small>robot asisten</small></h1>
          <div class="stage" id="stage">
          <div class="bubble" id="bubble">Halo! Aku Robo. Ketik atau ucapkan perintah.</div>
          <div class="robot" id="robot"><div class="rb idle" id="rb">
          <div class="ant"><i></i></div>
          <div class="head"><div class="face"><b class="eye"></b><b class="eye"></b><span class="mouth"></span></div></div>
          <div class="arm l"></div><div class="arm r"></div>
          <div class="body"><span class="chest"></span></div>
          <div class="leg l"></div><div class="leg r"></div>
          </div></div>
          <div class="ground"></div>
          </div>
          <div class="chips" id="chips"></div>
          <div class="set"><button id="bg" hidden>🔴 Mode latar belakang: mati</button><div class="row"><select id="vsel" title="Suara"></select><select id="ssel" title="Gaya suara"><option value="robot">Robot</option><option value="normal">Normal</option><option value="ceria">Ceria</option><option value="imut">Imut</option></select><button id="vtest">🔈 Coba</button></div></div>
          <div class="log" id="log"></div>
          <div class="bar"><button id="mic" title="Mode suara: ketuk untuk mulai atau berhenti">🎤</button><button id="vol" title="Suara robot">🔊</button><input id="inp" placeholder="Ketik perintah…" autocomplete="off"><button id="go">Kirim</button></div>
          </main>
          <script>
          const $=id=>document.getElementById(id);
          const rb=$('rb'),robot=$('robot'),bubble=$('bubble'),log=$('log'),inp=$('inp');
          let pos=50,mv=0,tmr=null,state='idle',voiceOn=true,notes=[];
          const syn=window.speechSynthesis;
          const jokes=['Kenapa robot tidak pernah panik? Karena kabelnya selalu tersambung ke tenang.','Apa bedanya aku dan kalkulator? Aku bisa joget, kalkulator cuma bisa pasrah.','Aku tidak takut gelap. Aku punya lampu di dada.','Kenapa robot suka main gitar? Karena punya banyak senar kabel.'];
          const colors={merah:'#f87171',biru:'#38bdf8',hijau:'#4ade80',kuning:'#facc15',ungu:'#a78bfa',pink:'#f472b6',oranye:'#fb923c'};
          function set(s){state=s;rb.className='rb '+s}
          function act(s,ms){set(s);setTimeout(()=>{if(state===s)set('idle')},ms)}
          function add(t,c){const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.appendChild(d);log.scrollTop=log.scrollHeight}
          let rec=null,live=false,speaking=false,sid=0;
          const STY={robot:[0.55,0.9],normal:[1,1],ceria:[1.4,1.1],imut:[1.8,1.15]};let vName='',vStyle='robot';
          function pickVoice(){try{const l=syn.getVoices();return l.find(v=>v.name===vName)||l.find(v=>/^id/i.test(v.lang))||null}catch(e){return null}}
          function say(t){
          bubble.textContent=t;add(t,'r');robot.classList.add('talk');speaking=true;const id=++sid;if(window.Native){if(live)try{Native.stop()}catch(e){}}else if(rec&&live){try{rec.stop()}catch(e){}}
          let d=0;const fin=()=>{if(d||id!==sid)return;d=1;speaking=false;robot.classList.remove('talk');if(live)setTimeout(listen,300)};let sp=false;
          try{if(window.Native&&voiceOn){window.onSpeakDone=fin;Native.speak(t);sp=true}else if(syn&&voiceOn){syn.cancel();const u=new SpeechSynthesisUtterance(t),v=pickVoice();u.lang='id-ID';if(v)u.voice=v;u.pitch=STY[vStyle][0];u.rate=STY[vStyle][1];u.onend=fin;u.onerror=fin;syn.speak(u);sp=true}}catch(e){}
          setTimeout(fin,sp?t.length*120+3000:Math.max(1200,t.length*65));
          }
          function walk(to,cb){
          to=Math.max(14,Math.min(86,to));const d=Math.abs(to-pos),k=++mv;
          if(d<1){cb&&cb();return}
          const ms=d*45;robot.style.transition='left '+ms+'ms linear';robot.style.left=to+'%';pos=to;set('walk');
          setTimeout(()=>{if(k===mv){set('idle');cb&&cb()}},ms);
          }
          function halt(){
          mv++;const r=robot.getBoundingClientRect(),s=$('stage').getBoundingClientRect();
          pos=(r.left+r.width/2-s.left)/s.width*100;robot.style.transition='none';robot.style.left=pos+'%';set('idle');
          }
          const appsA=[[/(wa|whatsapp|w a)\s*(bisnis|business|bisnes)/,'WA Bisnis','send/','whatsapp','com.whatsapp.w4b'],[/whatsapp|\bwa\b/,'WhatsApp','send/','whatsapp','com.whatsapp'],[/gmail|e-?mail|surel/,'Gmail','','mailto','com.google.android.gm'],[/youtube|yutub/,'YouTube','www.youtube.com/','https','com.google.android.youtube'],[/instagram|\big\b/,'Instagram','www.instagram.com/','https','com.instagram.android'],[/tiktok/,'TikTok','www.tiktok.com/','https','com.ss.android.ugc.trill'],[/facebook|\bfb\b/,'Facebook','www.facebook.com/','https','com.facebook.katana'],[/telegram/,'Telegram','t.me/','https','org.telegram.messenger'],[/spotify/,'Spotify','open.spotify.com/','https','com.spotify.music'],[/maps|peta/,'Google Maps','maps.google.com/','https','com.google.android.apps.maps'],[/drive/,'Google Drive','drive.google.com/','https','com.google.android.apps.docs'],[/shopee/,'Shopee','shopee.co.id/','https','com.shopee.id'],[/tokopedia|tokped/,'Tokopedia','www.tokopedia.com/','https','com.tokopedia.tkpd'],[/gojek/,'Gojek','www.gojek.com/','https','com.gojek.app'],[/grab/,'Grab','www.grab.com/','https','com.grab.passenger'],[/\bx\b|twitter/,'X','x.com/','https','com.twitter.android'],[/github/,'GitHub','github.com/','https','com.github.android']];
          function intent(h,s,p){return 'intent://'+h+'#Intent;scheme='+s+';package='+p+';S.browser_fallback_url='+encodeURIComponent('https://play.google.com/store/apps/details?id='+p)+';end'}
          function openApp(n,i){
          let left=false;const f=()=>{if(document.hidden)left=true};document.addEventListener('visibilitychange',f);window.addEventListener('pagehide',()=>{left=true},{once:true});setTimeout(()=>{document.removeEventListener('visibilitychange',f);if(!left&&!document.hidden)say('Aplikasi '+n+' belum terbuka. Ketuk tombol Buka '+n+' di bawah.')},2000);try{location.href=i}catch(e){}
          const d=document.createElement('div'),a=document.createElement('a');d.className='m r';a.href=i;a.className='btn';a.textContent='Buka '+n+' →';d.appendChild(a);log.appendChild(d);log.scrollTop=log.scrollHeight;
          }
          const apps=[[/gmail|e-?mail|surel/,'https://mail.google.com','Gmail'],[/youtube|yutub/,'https://www.youtube.com','YouTube'],[/whatsapp|\bwa\b/,'https://web.whatsapp.com','WhatsApp'],[/instagram|\big\b/,'https://www.instagram.com','Instagram'],[/tiktok/,'https://www.tiktok.com','TikTok'],[/facebook|\bfb\b/,'https://www.facebook.com','Facebook'],[/maps|peta/,'https://maps.google.com','Google Maps'],[/drive/,'https://drive.google.com','Google Drive'],[/github/,'https://github.com','GitHub'],[/google/,'https://www.google.com','Google']];
          function openUrl(u,n){
          try{window.Native?Native.openUrl(u):window.open(u,'_blank','noopener')}catch(e){}
          const d=document.createElement('div'),a=document.createElement('a');d.className='m r';a.href=u;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Buka '+n+' →';d.appendChild(a);log.appendChild(d);log.scrollTop=log.scrollHeight;
          }
          function run(raw){
          const t=raw.trim();if(!t)return;add(t,'u');const q=t.toLowerCase();let m;
          if(m=q.match(/(timer|ingatkan|alarm).*?(\d+)\s*(detik|menit)/)){
          const n=+m[2],ms=n*(m[3]==='menit'?60000:1000);
          if(ms>3600000)return say('Maksimal satu jam ya.');
          clearTimeout(tmr);tmr=setTimeout(()=>{act('jump',900);say('Waktu habis! Timer '+n+' '+m[3]+' selesai.')},ms);
          return say('Siap! Timer '+n+' '+m[3]+' dimulai. Biarkan halaman ini tetap terbuka.');
          }
          m=q.match(/(\d[\d\s+\-*\/x×÷:().,]*\d)/);
          if(m&&/[+\-*\/x×÷:]/.test(m[1])){
          try{const e=m[1].replace(/[x×]/g,'*').replace(/[÷:]/g,'/').replace(/,/g,'.');
          if(!/^[\d\s+\-*\/().]+$/.test(e))throw 0;
          const v=Function('return ('+e+')')();if(!isFinite(v))throw 0;
          return say(m[1].trim()+' = '+(+v.toFixed(6)));
          }catch(x){return say('Maaf, hitungan itu belum bisa aku selesaikan.')}
          }
          if(m=q.match(/^(?:buka|bukakan|open|akses|kunjungi|masuk ke)\s+(.+)/)){
          const w=m[1].replace(/^(aplikasi|website|situs)\s+/,'').trim();
          if(window.Native){const r=Native.openApp(w);if(r){act('jump',600);say('Aplikasi '+r+' terbuka.');return}
          if(!/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(w)){say('Aku tidak menemukan aplikasi bernama '+w+' di HP ini.');return}}
          const A=!window.Native&&/android/i.test(navigator.userAgent);
          for(const [re,nm,h,sc,pk] of appsA)if(A&&re.test(w)){act('jump',600);say('Membuka aplikasi '+nm+'…');openApp(nm,intent(h,sc,pk));return}
          for(const [re,u,nm] of apps)if(re.test(w)){act('jump',600);say('Oke, membuka '+nm+' di browser.');openUrl(u,nm);return}
          if(/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(w)){say('Oke, membuka '+w+'.');openUrl('https://'+w,w);return}
          return say('Aku belum kenal situs itu. Coba sebut nama seperti Gmail atau YouTube, atau alamat seperti contoh.com.');
          }
          if(m=q.match(/^(?:cari|carikan|googling|search)\s+(.+)/)){say('Mencari '+m[1]+' di Google.');openUrl('https://www.google.com/search?q='+encodeURIComponent(m[1]),'hasil pencarian');return}
          if(m=q.match(/^(?:putar|setel|play)\s+(.+)/)){say('Memutar '+m[1]+' di YouTube.');openUrl('https://www.youtube.com/results?search_query='+encodeURIComponent(m[1]),'YouTube');return}
          if(/^(halo|hai|hi|hello|selamat)/.test(q))return say('Halo! Aku Robo, robot asistenmu. Mau aku ngapain?');
          if(/siapa (kamu|namamu)|namamu/.test(q))return say('Aku Robo, robot asisten yang bisa jalan, joget, menghitung, dan mengatur timer.');
          if(/jam|waktu/.test(q))return say('Sekarang jam '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));
          if(/tanggal|hari ini|hari apa/.test(q))return say('Hari ini '+new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
          if(/diam|stop|berhenti/.test(q)){halt();return say('Oke, aku berhenti.')}
          if(/joget|dance|menari/.test(q)){act('dance',4000);return say('Yeay, waktunya joget!')}
          if(/lompat/.test(q)){act('jump',700);return say('Hup!')}
          const n=(q.match(/(\d+)/)||[])[1],step=n?Math.min(+n,10)*8:30;
          if(/kanan/.test(q)){walk(pos+step);return say('Oke, jalan ke kanan.')}
          if(/kiri/.test(q)){walk(pos-step);return say('Oke, jalan ke kiri.')}
          if(/tengah|pusat|kembali/.test(q)){walk(50);return say('Kembali ke tengah.')}
          if(/jalan|keliling|patroli|maju/.test(q)){walk(16,()=>walk(84,()=>walk(50)));return say('Aku keliling dulu ya.')}
          for(const k in colors)if(q.includes(k)){document.documentElement.style.setProperty('--rc',colors[k]);return say('Sekarang aku berwarna '+k+'.')}
          if(/lelucon|lucu|jokes|hibur/.test(q))return say(jokes[Math.floor(Math.random()*jokes.length)]);
          if(/^catat/.test(q)){const x=t.replace(/^catat\s*/i,'');if(!x)return say('Apa yang mau dicatat?');notes.push(x);return say('Dicatat: '+x)}
          if(/catatan/.test(q))return say(notes.length?'Catatanmu: '+notes.join(', '):'Belum ada catatan.');
          if(/terima kasih|makasih/.test(q))return say('Sama-sama!');
          if(/bantuan|help|bisa apa/.test(q))return say('Aku bisa: jalan kanan/kiri, keliling, joget, lompat, jam, tanggal, hitung 12 x 7, timer 10 detik, ganti warna, catat sesuatu, lelucon, buka aplikasi seperti WA Bisnis, Gmail, atau YouTube, cari di Google, dan putar lagu di YouTube. Ketuk 🎤 untuk mode suara.');
          say('Aku belum paham perintah itu. Ketik “bantuan” untuk melihat yang bisa aku lakukan.');
          }
          ['Buka WA Bisnis','Buka email','Buka YouTube','Jam berapa?','Jalan ke kanan','Jalan ke kiri','Keliling','Joget','Lompat','Hitung 12 x 7','Timer 10 detik','Warna ungu','Lelucon','Bantuan'].forEach(c=>{
          const b=document.createElement('button');b.textContent=c;b.onclick=()=>run(c);$('chips').appendChild(b)});
          $('go').onclick=()=>{run(inp.value);inp.value=''};
          inp.addEventListener('keydown',e=>{if(e.key==='Enter'){run(inp.value);inp.value=''}});
          $('vol').onclick=()=>{voiceOn=!voiceOn;$('vol').textContent=voiceOn?'🔊':'🔇';try{if(!voiceOn)syn.cancel()}catch(e){}};
          const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
          function stopUI(){robot.classList.remove('listen');$('mic').classList.remove('on')}
          function listen(){
          if(window.Native){if(!live||speaking)return;try{Native.listen()}catch(e){}return}
          if(!SR||!live||speaking)return;
          try{
          if(rec){rec.onresult=rec.onend=rec.onerror=null;try{rec.abort()}catch(e){}}
          rec=new SR();rec.lang='id-ID';rec.interimResults=false;
          rec.onstart=()=>{robot.classList.add('listen');$('mic').classList.add('on');bubble.textContent='Mendengarkan… ucapkan perintah.'};
          rec.onresult=e=>{const x=e.results[e.results.length-1][0].transcript;run(x.replace(/^\s*(halo robo|hai robo|robo)[, ]*/i,'')||x)};
          rec.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){live=false;stopUI();say('Izin mikrofon ditolak. Izinkan mikrofon di browser, lalu ketuk 🎤 lagi.')}else if(e.error==='audio-capture'){live=false;stopUI();say('Mikrofon tidak terdeteksi.')}};
          rec.onend=()=>{stopUI();if(live&&!speaking)setTimeout(listen,300)};
          rec.start();
          }catch(e){live=false;stopUI();say('Mikrofon tidak bisa dipakai. Ketik saja ya.')}
          }
          window.onNativeStart=()=>{robot.classList.add('listen');$('mic').classList.add('on');bubble.textContent='Mendengarkan… ucapkan perintah.'};
          window.onNativeResult=x=>{run(x.replace(/^\s*(halo robo|hai robo|robo)[, ]*/i,'')||x)};
          window.onNativeEnd=()=>{stopUI();if(live&&!speaking)setTimeout(listen,300)};
          window.onNativeError=m=>{live=false;stopUI();say(m==='bg'?'Mode latar belakang sedang aktif, jadi langsung ucapkan perintahmu tanpa membuka aplikasi.':m==='denied'?'Izin mikrofon ditolak. Izinkan mikrofon di pengaturan aplikasi, lalu ketuk 🎤 lagi.':'Pengenal suara tidak tersedia di HP ini. Ketik saja ya.')};
          $('mic').onclick=()=>{
          if(!SR&&!window.Native)return say('Browser ini belum mendukung perintah suara. Coba pakai Chrome, atau ketik saja ya.');
          if(live){live=false;try{window.Native?Native.stop():rec.abort()}catch(e){}stopUI();bubble.textContent='Mode suara dimatikan.';return}
          live=true;try{syn&&syn.cancel()}catch(e){}
          say('Aku mendengarkan. Ucapkan perintah, misalnya “buka WA Bisnis”.');
          };
          try{if(window.Native){const o=JSON.parse(Native.getVoice());vName=o.voice||'';vStyle=o.style||'robot'}else{const o=JSON.parse(localStorage.getItem('robo-v')||'null');if(o){vName=o[0]||'';vStyle=o[1]||'robot'}}}catch(e){}
          function fillVoices(){let l=[];try{l=window.Native?JSON.parse(Native.voices()):syn.getVoices().filter(v=>/^(id|in)/i.test(v.lang)).map(v=>v.name)}catch(e){}
          const s=$('vsel');s.innerHTML='';if(!l.length)s.add(new Option('Suara bawaan',''));else l.forEach((n,i)=>s.add(new Option('Suara '+(i+1),n)));s.value=vName;if(s.selectedIndex<0)s.selectedIndex=0}
          fillVoices();setTimeout(fillVoices,1500);setTimeout(fillVoices,4000);try{syn.onvoiceschanged=fillVoices}catch(e){}
          $('ssel').value=vStyle;
          $('vsel').onchange=$('ssel').onchange=()=>{vName=$('vsel').value;vStyle=$('ssel').value;try{window.Native&&Native.setVoice(vName,vStyle)}catch(e){}try{localStorage.setItem('robo-v',JSON.stringify([vName,vStyle]))}catch(e){}};
          $('vtest').onclick=()=>say('Halo, aku Robo. Beginilah suaraku sekarang.');
          if(window.Native){const b=$('bg');b.hidden=false;
          const upd=(on,msg)=>{b.classList.toggle('on',on);b.textContent=on?'🟢 Mode latar belakang: AKTIF (ketuk untuk mematikan)':'🔴 Mode latar belakang: mati';
          if(msg==='overlay')say('Izinkan Tampil di atas aplikasi lain untuk Robo, lalu kembali ke sini. Mode akan menyala otomatis.');
          else if(msg==='denied')say('Izin mikrofon diperlukan untuk mode latar belakang.');
          else if(on&&msg!=='init')say('Mode latar belakang aktif. Sekarang kamu bisa keluar dari aplikasi dan langsung ucapkan perintah, misalnya buka WA Bisnis.')};
          window.onBgState=upd;try{upd(Native.bgActive(),'init')}catch(e){}
          b.onclick=()=>{try{Native.bgToggle()}catch(e){}}}
          </script>
          </body>
          </html>
          RBEOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Robo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: robo-${{ github.run_number }}
          name: Robo APK ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
