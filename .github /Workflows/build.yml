          package com.kay.robo

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.app.KeyguardManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Intent
          import android.graphics.Path
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.os.PowerManager
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class RoboAccessibility : AccessibilityService() {
              companion object {
                  @Volatile
                  var instance: RoboAccessibility? = null
              }

              private val h = Handler(Looper.getMainLooper())
              private var pin = ""
              private var idx = 0
              private var tries = 0
              private var busy = false
              private var viaSwipe = false
              private var submitAt = -1

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              override fun onUnbind(intent: Intent?): Boolean {
                  stopScroll()
                  instance = null
                  return super.onUnbind(intent)
              }

              fun enter(p: String) {
                  start(p, false)
              }

              fun unlock(p: String) {
                  start(p, true)
              }

              private fun start(p: String, swipe: Boolean) {
                  if (busy) return
                  busy = true
                  pin = p
                  idx = 0
                  tries = 0
                  submitAt = -1
                  viaSwipe = swipe
                  if (swipe) {
                      h.postDelayed({
                          swipeUp()
                          h.postDelayed({ step() }, 800L)
                      }, 600L)
                  } else {
                      h.postDelayed({ step() }, 900L)
                  }
              }

              @Volatile
              var scrolling = false
              private var scrollMs = 8000L

              private val scrollTick = object : Runnable {
                  override fun run() {
                      if (!scrolling) return
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      if (!pm.isInteractive) {
                          stopScroll()
                          RoboService.speak?.invoke("Layar mati, scroll otomatis berhenti.")
                          return
                      }
                      feedSwipe(true)
                      h.postDelayed(this, scrollMs)
                  }
              }

              fun startScroll(ms: Long) {
                  stopScroll()
                  scrollMs = ms
                  scrolling = true
                  h.postDelayed(scrollTick, 1200L)
              }

              fun stopScroll() {
                  scrolling = false
                  h.removeCallbacks(scrollTick)
              }

              fun feedSwipe(up: Boolean) {
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels.toFloat()
                  val hh = dm.heightPixels.toFloat()
                  val path = Path()
                  if (up) {
                      path.moveTo(w / 2f, hh * 0.78f)
                      path.lineTo(w / 2f, hh * 0.28f)
                  } else {
                      path.moveTo(w / 2f, hh * 0.28f)
                      path.lineTo(w / 2f, hh * 0.78f)
                  }
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0L, 250L))
                      .build()
                  dispatchGesture(g, null, null)
              }

              private fun say(t: String) {
                  RoboService.speak?.invoke(t)
              }

              fun typeText(text: String, send: Boolean) {
                  val root = rootInActiveWindow
                  if (root == null) {
                      say("Aku tidak bisa membaca layar sekarang.")
                      return
                  }
                  var f: AccessibilityNodeInfo? = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT)
                  if (f == null || !f.isEditable) {
                      f = find(root) { it.isEditable && !it.isPassword && it.isVisibleToUser }
                  }
                  if (f == null) {
                      say("Tidak ada kolom ketik di layar.")
                      return
                  }
                  if (!f.isFocused) {
                      f.performAction(AccessibilityNodeInfo.ACTION_FOCUS)
                      f.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                  }
                  val cur = if (f.isShowingHintText) "" else (f.text?.toString() ?: "")
                  val full = if (cur.isBlank()) text else cur + " " + text
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, full)
                  if (!f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)) {
                      val cm = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("robo", text))
                      f.performAction(AccessibilityNodeInfo.ACTION_PASTE)
                  }
                  if (send) {
                      h.postDelayed({ sendMsg(0) }, 600L)
                  } else {
                      say("Sudah diketik.")
                  }
              }

              fun sendMsg(n: Int) {
                  val root = rootInActiveWindow
                  val k = if (root == null) null else find(root) { x ->
                      val id = x.viewIdResourceName ?: ""
                      val d = (x.contentDescription?.toString() ?: "").trim().lowercase()
                      x.isVisibleToUser && (id.endsWith(":id/send") || id.endsWith("/send_button") || id.endsWith("/send_btn") ||
                          d == "kirim" || d == "send" || d == "kirim pesan" || d == "send message")
                  }
                  if (k != null && click(k)) {
                      say("Pesan dikirim.")
                      return
                  }
                  if (n < 6) {
                      h.postDelayed({ sendMsg(n + 1) }, 350L)
                  } else {
                      say("Tombol kirim tidak ketemu. Pesan sudah diketik, kirim manual ya.")
                  }
              }

              fun clearText() {
                  val root = rootInActiveWindow
                  if (root == null) {
                      say("Aku tidak bisa membaca layar sekarang.")
                      return
                  }
                  val f = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: find(root) { it.isEditable && !it.isPassword && it.isVisibleToUser }
                  if (f == null) {
                      say("Tidak ada kolom ketik di layar.")
                      return
                  }
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, "")
                  f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)
                  say("Teks dihapus.")
              }

              private fun swipeUp() {
                  val dm = resources.displayMetrics
                  val w = dm.widthPixels.toFloat()
                  val hh = dm.heightPixels.toFloat()
                  val path = Path()
                  path.moveTo(w / 2f, hh * 0.92f)
                  path.lineTo(w / 2f, hh * 0.30f)
                  val g = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0L, 300L))
                      .build()
                  dispatchGesture(g, null, null)
              }

              private fun find(n: AccessibilityNodeInfo?, ok: (AccessibilityNodeInfo) -> Boolean): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (ok(n)) return n
                  for (i in 0 until n.childCount) {
                      val r = find(n.getChild(i), ok)
                      if (r != null) return r
                  }
                  return null
              }

              private fun click(n: AccessibilityNodeInfo): Boolean {
                  var c: AccessibilityNodeInfo? = n
                  while (c != null) {
                      if (c.isClickable) return c.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                      c = c.parent
                  }
                  return false
              }

              private fun onLock(root: AccessibilityNodeInfo?): Boolean {
                  val pk = root?.packageName?.toString() ?: ""
                  return root != null && (pk.contains("systemui") || pk.contains("keyguard"))
              }

              private fun pressEnter(root: AccessibilityNodeInfo?) {
                  if (root == null || !onLock(root)) return
                  val k = find(root) { n ->
                      val l = (n.text?.toString() ?: n.contentDescription?.toString() ?: "").trim().lowercase()
                      l == "enter" || l == "ok" || l == "masukkan" || l == "selesai" || l == "done" ||
                          (n.viewIdResourceName ?: "").endsWith("key_enter")
                  }
                  if (k != null) click(k)
              }

              private fun finish(ok: Boolean) {
                  busy = false
                  if (!viaSwipe) return
                  if (ok) h.postDelayed({ performGlobalAction(GLOBAL_ACTION_HOME) }, 500L)
                  if (ok || pin.isNotEmpty()) RoboService.listener?.invoke(ok)
              }

              private fun step() {
                  val kg = getSystemService(KEYGUARD_SERVICE) as KeyguardManager
                  if (!kg.isKeyguardLocked) {
                      finish(true)
                      return
                  }
                  val limit = if (pin.isEmpty()) 12 else 60
                  if (tries++ > limit) {
                      finish(false)
                      return
                  }
                  if (viaSwipe && tries == 7 && idx == 0 && submitAt < 0) swipeUp()
                  if (pin.isEmpty()) {
                      h.postDelayed({ step() }, 400L)
                      return
                  }
                  if (submitAt >= 0) {
                      if (tries - submitAt > 15) {
                          finish(false)
                          return
                      }
                      h.postDelayed({ step() }, 400L)
                      return
                  }
                  val root = rootInActiveWindow
                  if (!onLock(root)) {
                      h.postDelayed({ step() }, 400L)
                      return
                  }
                  if (pin.all { it.isDigit() }) {
                      if (idx >= pin.length) {
                          pressEnter(root)
                          submitAt = tries
                          h.postDelayed({ step() }, 400L)
                          return
                      }
                      val d = pin[idx].toString()
                      val key = find(root) {
                          it.isVisibleToUser && (it.text?.toString()?.trim() == d || it.contentDescription?.toString()?.trim() == d)
                      }
                      if (key != null && click(key)) {
                          idx++
                          h.postDelayed({ step() }, 220L)
                      } else {
                          h.postDelayed({ step() }, 400L)
                      }
                      return
                  }
                  val f = find(root) { it.isEditable && it.isPassword }
                  if (f == null) {
                      h.postDelayed({ step() }, 400L)
                      return
                  }
                  val b = Bundle()
                  b.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, pin)
                  f.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, b)
                  h.postDelayed({
                      if (Build.VERSION.SDK_INT >= 30) {
                          f.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)
                      }
                      pressEnter(rootInActiveWindow)
                      submitAt = tries
                      h.postDelayed({ step() }, 400L)
                  }, 400L)
              }
          }
