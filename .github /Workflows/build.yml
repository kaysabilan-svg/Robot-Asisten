name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tulis file proyek
        run: |
          cat > settings.gradle <<'RBEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'Robo'
          include ':app'
          RBEOF
          cat > build.gradle <<'RBEOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          RBEOF
          cat > gradle.properties <<'RBEOF'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          RBEOF
          mkdir -p app
          cat > app/build.gradle <<'RBEOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.kay.robo'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.kay.robo'
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          RBEOF
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'RBEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.HOME" />
                  </intent>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE" /></intent>
              </queries>
              <application
                  android:label="Robo"
                  android:allowBackup="false"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity
                      android:name=".UnlockActivity"
                      android:exported="false"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar"
                      android:excludeFromRecents="true"
                      android:launchMode="singleTop"
                      android:showWhenLocked="true"
                      android:turnScreenOn="true" />
                  <service
                      android:name=".RoboService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
                  <service
                      android:name=".RoboAccessibility"
                      android:exported="true"
                      android:label="Robo"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility" />
                  </service>
              </application>
          </manifest>
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/MainActivity.kt <<'RBEOF'
          package com.kay.robo

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.webkit.JavascriptInterface
          import android.webkit.WebResourceRequest
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var tts: TextToSpeech? = null
              private var recognizer: SpeechRecognizer? = null
              private var pending = false
              private var pendingBg = false
              private var awaitOverlay = false

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  Cfg.load(this)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView, request: WebResourceRequest): Boolean {
                          if (request.url.scheme == "file") return false
                          openExternal(request.url.toString())
                          return true
                      }
                  }
                  web.addJavascriptInterface(Bridge(), "Native")
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          tts?.let { t ->
                              Voice.apply(this, t)
                              t.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(id: String?) {}
                                  override fun onDone(id: String?) { js("window.onSpeakDone&&window.onSpeakDone()") }
                                  @Deprecated("Deprecated in Java")
                                  override fun onError(id: String?) { js("window.onSpeakDone&&window.onSpeakDone()") }
                              })
                          }
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              override fun onResume() {
                  super.onResume()
                  if (awaitOverlay) {
                      awaitOverlay = false
                      if (Settings.canDrawOverlays(this)) startBackground() else js("window.onBgState&&window.onBgState(false)")
                  }
                  js("window.onBgState&&window.onBgState(" + RoboService.active + ",'init')")
              }

              private fun js(code: String) {
                  runOnUiThread { web.evaluateJavascript(code, null) }
              }

              private fun openExternal(url: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(url)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                  }
              }

              private fun micOk(): Boolean =
                  checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED

              private fun startBackground() {
                  val need = ArrayList<String>()
                  if (!micOk()) need.add(Manifest.permission.RECORD_AUDIO)
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED
                  ) need.add(Manifest.permission.POST_NOTIFICATIONS)
                  if (need.isNotEmpty()) {
                      pendingBg = true
                      requestPermissions(need.toTypedArray(), 2)
                      return
                  }
                  if (!Settings.canDrawOverlays(this)) {
                      awaitOverlay = true
                      js("window.onBgState&&window.onBgState(false,'overlay')")
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      return
                  }
                  startForegroundService(Intent(this, RoboService::class.java))
                  js("window.onBgState&&window.onBgState(true)")
              }

              private fun startListening() {
                  if (!micOk()) {
                      pending = true
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      js("window.onNativeError&&window.onNativeError('unavailable')")
                      return
                  }
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(p: Bundle?) { js("window.onNativeStart&&window.onNativeStart()") }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(v: Float) {}
                      override fun onBufferReceived(b: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onError(e: Int) {
                          if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                              js("window.onNativeError&&window.onNativeError('denied')")
                          } else {
                              js("window.onNativeEnd&&window.onNativeEnd()")
                          }
                      }
                      override fun onResults(b: Bundle?) {
                          val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t != null) js("window.onNativeResult&&window.onNativeResult(" + JSONObject.quote(t) + ")")
                          js("window.onNativeEnd&&window.onNativeEnd()")
                      }
                      override fun onPartialResults(b: Bundle?) {}
                      override fun onEvent(t: Int, b: Bundle?) {}
                  })
                  val (complete, possibly, _) = Cfg.micTimings()
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "id-ID")
                      .putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, complete)
                      .putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, possibly)
                  r.startListening(i)
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 2 && pendingBg) {
                      pendingBg = false
                      if (micOk()) startBackground() else js("window.onBgState&&window.onBgState(false,'denied')")
                      return
                  }
                  if (pending) {
                      pending = false
                      if (micOk()) startListening() else js("window.onNativeError&&window.onNativeError('denied')")
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  tts?.shutdown()
                  recognizer?.destroy()
                  web.destroy()
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun speak(t: String) {
                      runOnUiThread {
                          tts?.let {
                              Voice.apply(this@MainActivity, it)
                              it.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u")
                          }
                      }
                  }

                  @JavascriptInterface
                  fun openUrl(u: String) {
                      runOnUiThread { openExternal(u) }
                  }

                  @JavascriptInterface
                  fun listen() {
                      runOnUiThread {
                          if (RoboService.active) {
                              js("window.onNativeError&&window.onNativeError('bg')")
                          } else {
                              startListening()
                          }
                      }
                  }

                  @JavascriptInterface
                  fun stop() {
                      runOnUiThread {
                          try {
                              recognizer?.cancel()
                          } catch (e: Exception) {
                          }
                      }
                  }

                  @JavascriptInterface
                  fun openApp(q: String): String {
                      val hit = Apps.find(this@MainActivity, q) ?: return ""
                      runOnUiThread { Apps.launch(this@MainActivity, hit.second) }
                      return hit.first
                  }

                  @JavascriptInterface
                  fun voices(): String = JSONArray(Voice.list(tts)).toString()

                  @JavascriptInterface
                  fun getVoice(): String =
                      JSONObject().put("voice", Voice.voiceName(this@MainActivity)).put("style", Voice.style(this@MainActivity)).toString()

                  @JavascriptInterface
                  fun setVoice(v: String, s: String) {
                      Voice.save(this@MainActivity, v, s)
                  }

                  @JavascriptInterface
                  fun setClap(on: Boolean, sens: Int, count: Int) {
                      Cfg.save(this@MainActivity, on, sens, count)
                  }

                  @JavascriptInterface
                  fun clapState(): String =
                      JSONObject().put("on", Cfg.clapOn).put("sens", Cfg.clapSens).put("count", Cfg.clapCount).toString()

                  @JavascriptInterface
                  fun savePin(p: String, word: String): Boolean {
                      return try {
                          if (p.isNotEmpty()) Vault.savePin(this@MainActivity, p)
                          Vault.saveWord(this@MainActivity, word)
                          true
                      } catch (e: Exception) {
                          false
                      }
                  }

                  @JavascriptInterface
                  fun clearPin() {
                      Vault.clear(this@MainActivity)
                  }

                  @JavascriptInterface
                  fun pinState(): String =
                      JSONObject()
                          .put("pin", Vault.has(this@MainActivity))
                          .put("word", Vault.word(this@MainActivity).isNotEmpty())
                          .put("acc", RoboAccessibility.instance != null)
                          .toString()

                  @JavascriptInterface
                  fun openAccSettings() {
                      runOnUiThread {
                          try {
                              startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                          } catch (e: Exception) {
                          }
                      }
                  }

                  @JavascriptInterface
                  fun setAuto(sec: Int, send: Boolean) {
                      Cfg.saveAuto(this@MainActivity, sec * 1000L, send)
                  }

                  @JavascriptInterface
                  fun autoState(): String =
                      JSONObject().put("sec", (Cfg.scrollMs / 1000L).toInt()).put("send", Cfg.autoSend).toString()

                  @JavascriptInterface
                  fun setMic(sens: Int) {
                      Cfg.saveMic(this@MainActivity, sens)
                  }

                  @JavascriptInterface
                  fun micState(): String =
                      JSONObject().put("sens", Cfg.micSens).toString()

                  @JavascriptInterface
                  fun bgActive(): Boolean = RoboService.active

                  @JavascriptInterface
                  fun bgToggle() {
                      runOnUiThread {
                          if (RoboService.active) {
                              stopService(Intent(this@MainActivity, RoboService::class.java))
                              js("window.onBgState&&window.onBgState(false,'off')")
                          } else {
                              startBackground()
                          }
                      }
                  }
              }
          }
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/Apps.kt <<'RBEOF'
          package com.kay.robo

          import android.content.Context
          import android.content.Intent
          import java.util.Locale

          object Apps {
              private class E(val label: String, val pkg: String, val n: String)

              @Volatile
              private var cache: List<E> = emptyList()

              @Volatile
              private var at = 0L

              private val rNon = Regex("[^a-z0-9]+")
              private val rWa = Regex("\\bwa\\b")
              private val rBis = Regex("\\b(bisnis|bisnes)\\b")
              private val rIg = Regex("\\big\\b")
              private val rYt = Regex("\\byt\\b")
              private val rFb = Regex("\\bfb\\b")
              private val rTokped = Regex("\\btokped\\b")
              private val rMail = Regex("\\b(email|e mail|surel)\\b")
              private val rSpace = Regex("\\s+")

              fun norm(s: String): String {
                  var x = s.lowercase(Locale.ROOT).replace(rNon, " ").trim()
                  x = x.replace(rWa, "whatsapp")
                      .replace(rBis, "business")
                      .replace(rIg, "instagram")
                      .replace(rYt, "youtube")
                      .replace(rFb, "facebook")
                      .replace(rTokped, "tokopedia")
                      .replace(rMail, "gmail")
                  return x.replace(rSpace, " ").trim()
              }

              @Synchronized
              fun refresh(ctx: Context) {
                  val pm = ctx.packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val l = ArrayList<E>()
                  for (ri in pm.queryIntentActivities(main, 0)) {
                      val label = ri.loadLabel(pm).toString()
                      val n = norm(label)
                      if (n.isNotEmpty()) l.add(E(label, ri.activityInfo.packageName, n))
                  }
                  cache = l
                  at = System.currentTimeMillis()
              }

              private fun search(list: List<E>, q: String): Pair<String, String>? {
                  val query = norm(q)
                  if (query.isEmpty()) return null
                  val toks = query.split(" ")
                  var best: Pair<String, String>? = null
                  var top = 0
                  for (e in list) {
                      val sc = when {
                          e.pkg.equals(q.trim(), true) -> 2000
                          e.n == query -> 1000
                          e.n.contains(query) -> 500 - e.n.length
                          toks.all { e.n.contains(it) } -> 300 - e.n.length
                          e.n.length >= 3 && query.contains(e.n) -> 200 - (query.length - e.n.length)
                          else -> 0
                      }
                      if (sc > top) {
                          top = sc
                          best = Pair(e.label, e.pkg)
                      }
                  }
                  return best
              }

              fun find(ctx: Context, q: String): Pair<String, String>? {
                  val now = System.currentTimeMillis()
                  if (cache.isEmpty() || now - at > 300000L) refresh(ctx)
                  val r = search(cache, q)
                  if (r != null) return r
                  if (System.currentTimeMillis() - at > 5000L) {
                      refresh(ctx)
                      return search(cache, q)
                  }
                  return null
              }

              fun ambiguous(q: String): Boolean {
                  val query = norm(q)
                  if (query.isEmpty()) return false
                  return cache.any { it.n.startsWith("$query ") }
              }

              fun launch(ctx: Context, pkg: String): Boolean {
                  return try {
                      val i = ctx.packageManager.getLaunchIntentForPackage(pkg) ?: return false
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      true
                  } catch (e: Exception) {
                      false
                  }
              }
          }
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/Voice.kt <<'RBEOF'
          package com.kay.robo

          import android.content.Context
          import android.speech.tts.TextToSpeech
          import java.util.Locale

          object Voice {
              private fun prefs(c: Context) = c.getSharedPreferences("robo", Context.MODE_PRIVATE)

              fun style(c: Context): String = prefs(c).getString("style", "robot") ?: "robot"

              fun voiceName(c: Context): String = prefs(c).getString("voice", "") ?: ""

              fun sig(c: Context): String = voiceName(c) + "|" + style(c)

              fun save(c: Context, voice: String, style: String) {
                  prefs(c).edit().putString("voice", voice).putString("style", style).apply()
              }

              fun apply(c: Context, t: TextToSpeech) {
                  t.setLanguage(Locale("id", "ID"))
                  val name = voiceName(c)
                  if (name.isNotEmpty()) {
                      try {
                          t.voices?.firstOrNull { it.name == name }?.let { t.setVoice(it) }
                      } catch (e: Exception) {
                      }
                  }
                  val p = when (style(c)) {
                      "normal" -> Pair(1.0f, 1.0f)
                      "ceria" -> Pair(1.4f, 1.1f)
                      "imut" -> Pair(1.8f, 1.15f)
                      else -> Pair(0.55f, 0.9f)
                  }
                  t.setPitch(p.first)
                  t.setSpeechRate(p.second)
              }

              fun list(t: TextToSpeech?): List<String> {
                  return try {
                      t?.voices
                          ?.filter { (it.locale.language == "in" || it.locale.language == "id") && !it.features.contains("notInstalled") }
                          ?.map { it.name }
                          ?.sorted() ?: emptyList()
                  } catch (e: Exception) {
                      emptyList()
                  }
              }
          }
          RBEOF
          mkdir -p app/src/main/java/com/kay/robo
          cat > app/src/main/java/com/kay/robo/RoboService.kt <<'RBEOF'
          package com.kay.robo

          import android.app.ActivityManager
          import android.app.AppOpsManager
          import android.app.KeyguardManager
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.Icon
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.os.SystemClock
          import android.os.Process
          import android.provider.Settings
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.speech.tts.UtteranceProgressListener
          import android.view.Gravity
          import android.view.View
          import android.view.WindowManager
          import java.util.Locale

          class RoboService : Service() {
              companion object {
                  @Volatile
                  var active = false

                  @Volatile
                  var listener: ((Boolean) -> Unit)? = null

                  @Volatile
                  var pinAllowed = false

                  @Volatile
                  var speak: ((String) -> Unit)? = null
              }

              private val h = Handler(Looper.getMainLooper())
              private var rec: SpeechRecognizer? = null
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var speaking = false
              private var running = false
              private var sayId = 0
              private var overlay: View? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  startFg()
                  if (!running) {
                      running = true
                      active = true
                      Cfg.load(this)
                      Thread { Apps.refresh(applicationContext) }.start()
                      listener = { ok ->
                          h.post { say(if (ok) "Layar sudah terbuka." else "Layar masih terkunci. Perlu PIN atau sidik jari.") }
                      }
                      speak = { m -> h.post { say(m) } }
                      showOverlay()
                      tts = TextToSpeech(this) { st ->
                          ttsReady = st == TextToSpeech.SUCCESS
                          if (ttsReady) {
                              tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                                  override fun onStart(id: String?) {}
                                  override fun onDone(id: String?) { h.post { speaking = false; listen() } }
                                  @Deprecated("Deprecated in Java")
                                  override fun onError(id: String?) { h.post { speaking = false; listen() } }
                              })
                              say("Robo aktif. Silakan ucapkan perintah.")
                          } else {
                              listen()
                          }
                      }
                  }
                  return START_STICKY
              }

              private fun startFg() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(NotificationChannel("robo", "Robo aktif", NotificationManager.IMPORTANCE_LOW))
                  nm.createNotificationChannel(NotificationChannel("robo_open", "Buka aplikasi", NotificationManager.IMPORTANCE_HIGH))
                  val stop = PendingIntent.getService(
                      this, 1, Intent(this, RoboService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val open = PendingIntent.getActivity(this, 2, Intent(this, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE)
                  val action = Notification.Action.Builder(
                      Icon.createWithResource(this, android.R.drawable.ic_menu_close_clear_cancel), "Matikan", stop
                  ).build()
                  val n = Notification.Builder(this, "robo")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentTitle("Robo aktif")
                      .setContentText("Mendengarkan perintah suara…")
                      .setContentIntent(open)
                      .setOngoing(true)
                      .addAction(action)
                      .build()
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun showOverlay() {
                  if (!Settings.canDrawOverlays(this)) return
                  val d = resources.displayMetrics.density
                  val size = (14 * d).toInt()
                  val v = View(this)
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(0xCC22C55E.toInt())
                  v.background = bg
                  val lp = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                      PixelFormat.TRANSLUCENT
                  )
                  lp.gravity = Gravity.TOP or Gravity.END
                  lp.x = (8 * d).toInt()
                  lp.y = (80 * d).toInt()
                  try {
                      (getSystemService(WINDOW_SERVICE) as WindowManager).addView(v, lp)
                      overlay = v
                  } catch (e: Exception) {
                  }
              }

              private fun say(t: String) {
                  val s = tts
                  if (s == null || !ttsReady) {
                      listen()
                      return
                  }
                  speaking = true
                  val my = ++sayId
                  try {
                      rec?.cancel()
                  } catch (e: Exception) {
                  }
                  val sg = Voice.sig(this)
                  if (sg != appliedSig) {
                      Voice.apply(this, s)
                      appliedSig = sg
                  }
                  s.speak(t, TextToSpeech.QUEUE_FLUSH, null, "u")
                  h.postDelayed({
                      if (speaking && my == sayId) {
                          speaking = false
                          listen()
                      }
                  }, t.length * 130L + 4000L)
              }

              private var handled = false
              private var partialText = ""
              private var appliedSig = ""

              private fun recIntent(): Intent {
                  val (complete, possibly, _) = Cfg.micTimings()
                  return Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      .putExtra(RecognizerIntent.EXTRA_LANGUAGE, "id-ID")
                      .putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                      .putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                      .putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_COMPLETE_SILENCE_LENGTH_MILLIS, complete)
                      .putExtra(RecognizerIntent.EXTRA_SPEECH_INPUT_POSSIBLY_COMPLETE_SILENCE_LENGTH_MILLIS, possibly)
              }

              private val partialRun = Runnable {
                  if (handled || speaking) return@Runnable
                  val t = partialText
                  if (t.isNotBlank() && handle(t, true)) {
                      handled = true
                      try {
                          rec?.cancel()
                      } catch (e: Exception) {
                      }
                  }
              }

              private val recListener = object : RecognitionListener {
                  override fun onReadyForSpeech(p: Bundle?) {}
                  override fun onBeginningOfSpeech() {}
                  override fun onRmsChanged(v: Float) { clap(v) }
                  override fun onBufferReceived(b: ByteArray?) {}
                  override fun onEndOfSpeech() {}
                  override fun onError(e: Int) {
                      h.removeCallbacks(partialRun)
                      if (e == SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS) {
                          stopSelf()
                          return
                      }
                      if (handled) return
                      val wait = when (e) {
                          SpeechRecognizer.ERROR_NO_MATCH, SpeechRecognizer.ERROR_SPEECH_TIMEOUT -> 100L
                          SpeechRecognizer.ERROR_RECOGNIZER_BUSY -> 800L
                          else -> {
                              resetRec()
                              800L
                          }
                      }
                      h.postDelayed({ listen() }, wait)
                  }
                  override fun onResults(b: Bundle?) {
                      h.removeCallbacks(partialRun)
                      if (!handled) {
                          val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t != null) handle(t, false)
                      }
                      handled = false
                      if (!speaking) h.postDelayed({ listen() }, 100L)
                  }
                  override fun onPartialResults(b: Bundle?) {
                      if (handled) return
                      val t = b?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull() ?: return
                      if (t.isBlank()) return
                      partialText = t
                      h.removeCallbacks(partialRun)
                      h.postDelayed(partialRun, Cfg.micTimings().third)
                  }
                  override fun onEvent(t: Int, b: Bundle?) {}
              }

              private fun resetRec() {
                  try {
                      rec?.destroy()
                  } catch (e: Exception) {
                  }
                  rec = null
              }

              private fun listen() {
                  if (!running || speaking) return
                  h.post {
                      if (!running || speaking) return@post
                      try {
                          val r: SpeechRecognizer = rec ?: SpeechRecognizer.createSpeechRecognizer(this).also {
                              it.setRecognitionListener(recListener)
                              rec = it
                          }
                          handled = false
                          partialText = ""
                          r.startListening(recIntent())
                      } catch (e: Exception) {
                          resetRec()
                          h.postDelayed({ listen() }, 1500L)
                      }
                  }
              }

              private var lastUnlock = 0L
              private var base = 0f
              private var prevR = 0f
              private var lastSpike = 0L
              private var claps = 0

              private fun needsUnlock(): Boolean {
                  val km = getSystemService(KEYGUARD_SERVICE) as KeyguardManager
                  val pm = getSystemService(POWER_SERVICE) as PowerManager
                  return km.isKeyguardLocked || !pm.isInteractive
              }

              private fun startUnlock(pinOk: Boolean) {
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastUnlock < 8000L) return
                  lastUnlock = now
                  wake()
                  val acc = RoboAccessibility.instance
                  if (acc != null) {
                      val pin = if (pinOk) (Vault.load(this) ?: "") else ""
                      h.postDelayed({ acc.unlock(pin) }, 300L)
                  } else {
                      pinAllowed = pinOk
                      unlockScreen()
                  }
              }

              private fun clap(v: Float) {
                  val jump = v - prevR
                  prevR = v
                  base = base * 0.95f + v * 0.05f
                  if (!Cfg.clapOn) return
                  val thr = when (Cfg.clapSens) {
                      0 -> 6.5f
                      2 -> 3.5f
                      else -> 5f
                  }
                  if (jump < thr || v - base < thr) return
                  val now = SystemClock.elapsedRealtime()
                  if (lastSpike != 0L && (now - lastSpike) in 120L..900L) {
                      claps++
                      lastSpike = now
                  } else if (lastSpike == 0L || now - lastSpike > 900L) {
                      claps = 1
                      lastSpike = now
                  } else {
                      return
                  }
                  h.removeCallbacks(clapCheck)
                  h.postDelayed(clapCheck, 750L)
              }

              private val clapCheck = Runnable {
                  val n = claps
                  claps = 0
                  lastSpike = 0L
                  if (n == Cfg.clapCount && needsUnlock()) startUnlock(true)
              }

              private fun handle(raw: String, partial: Boolean): Boolean {
                  val t = raw.lowercase(Locale.ROOT).trim().replace(Regex("^(halo robo|hai robo|robo)\\b[, ]*"), "")
                  if (Regex("^(?:buka\\s+kunci|buka\\s+layar|bukakan\\s+kunci|unlock)\\b").containsMatchIn(t)) {
                      if (partial && Vault.word(this).isNotEmpty()) return false
                      if (!needsUnlock()) {
                          say("Layar sudah terbuka.")
                          return true
                      }
                      val word = Vault.word(this).lowercase(Locale.ROOT)
                      val allowed = word.isEmpty() || t.contains(word)
                      val hasPin = Vault.has(this)
                      startUnlock(allowed)
                      say(
                          when {
                              hasPin && !allowed -> "Layar dinyalakan. Sebutkan kode rahasia untuk memasukkan PIN otomatis."
                              hasPin && RoboAccessibility.instance == null -> "Layar dinyalakan. Aktifkan layanan aksesibilitas Robo supaya PIN bisa dimasukkan otomatis."
                              else -> "Membuka kunci layar."
                          }
                      )
                      return true
                  }
                  val close = Regex("^(?:tutup|keluar dari)\\s*(?:aplikasi|app)?\\s*(.*)$").find(t)
                  if (close != null) {
                      if (partial) return false
                      val raw2 = close.groupValues[1].trim()
                      val q = if (Regex("^(ini|sekarang|yang terbuka|yang sedang terbuka)$").matches(raw2)) "" else raw2
                      closeApp(q)
                      return true
                  }
                  val rawc = raw.trim().replace(Regex("^(halo robo|hai robo|robo)\\b[, ]*", RegexOption.IGNORE_CASE), "")
                  val tn = t.replace(Regex("\\b(scrol|skrol|skroll|scrool|gulir)\\b"), "scroll")
                  if (Regex("(?:berhenti|stop|matikan|hentikan)\\s+scroll|scroll\\s+(?:otomatis\\s+)?(?:berhenti|stop|mati|selesai)").containsMatchIn(tn)) {
                      val acc = RoboAccessibility.instance
                      if (acc == null) {
                          if (partial) return false
                          say("Aktifkan layanan aksesibilitas Robo dulu.")
                          return true
                      }
                      acc.stopScroll()
                      say("Scroll otomatis berhenti.")
                      return true
                  }
                  if (Regex("(?:mulai|nyalakan|jalankan|aktifkan)\\s+scroll|scroll\\s+(?:otomatis\\s+)?(?:mulai|jalan|nyala|aktif)").containsMatchIn(tn)) {
                      if (partial) return false
                      val acc = RoboAccessibility.instance
                      if (acc == null) {
                          say("Aktifkan layanan aksesibilitas Robo dulu.")
                          return true
                      }
                      val secs = Regex("(\\d+)\\s*detik").find(tn)?.groupValues?.get(1)?.toLongOrNull()
                      val ms = when {
                          secs != null && secs in 2L..60L -> secs * 1000L
                          tn.contains("cepat") -> 4000L
                          tn.contains("lambat") || tn.contains("pelan") -> 15000L
                          else -> Cfg.scrollMs
                      }
                      acc.startScroll(ms)
                      say("Scroll otomatis mulai, setiap " + (ms / 1000L) + " detik.")
                      return true
                  }
                  val oneScroll = Regex("^scroll\\s+(turun|bawah|naik|atas)").find(tn)
                  if (oneScroll != null) {
                      if (partial) return false
                      val acc = RoboAccessibility.instance
                      if (acc == null) {
                          say("Aktifkan layanan aksesibilitas Robo dulu.")
                          return true
                      }
                      acc.feedSwipe(oneScroll.groupValues[1] == "turun" || oneScroll.groupValues[1] == "bawah")
                      return true
                  }
                  val typeM = Regex("^(?:ketik|ketikkan|tulis|balas)\\s+(.+)", RegexOption.IGNORE_CASE).find(rawc)
                  if (typeM != null) {
                      if (partial) return false
                      val acc = RoboAccessibility.instance
                      if (acc == null) {
                          say("Aktifkan layanan aksesibilitas Robo dulu.")
                          return true
                      }
                      acc.typeText(typeM.groupValues[1].trim(), Cfg.autoSend)
                      return true
                  }
                  if (Regex("^(?:kirim|kirim pesan|kirimkan)$").matches(t)) {
                      if (partial) return false
                      val acc = RoboAccessibility.instance
                      if (acc == null) {
                          say("Aktifkan layanan aksesibilitas Robo dulu.")
                          return true
                      }
                      acc.sendMsg(0)
                      return true
                  }
                  if (Regex("^(?:hapus teks|hapus ketikan|hapus tulisan)$").matches(t)) {
                      if (partial) return false
                      val acc = RoboAccessibility.instance
                      if (acc == null) {
                          say("Aktifkan layanan aksesibilitas Robo dulu.")
                          return true
                      }
                      acc.clearText()
                      return true
                  }
                  val open = Regex("^(?:buka|bukakan|open|jalankan|masuk ke)\\s+(.+)").find(t)
                  if (open != null) {
                      val q = open.groupValues[1].replace(Regex("^(aplikasi|app)\\s+"), "").trim()
                      val hit = Apps.find(this, q)
                      if (hit == null) {
                          if (partial) return false
                          say("Aku tidak menemukan aplikasi $q di HP ini.")
                          return true
                      }
                      if (partial && Apps.ambiguous(q)) return false
                      Apps.launch(this, hit.second)
                      say("Aplikasi ${hit.first} terbuka.")
                      hint(hit.first, hit.second)
                      return true
                  }
                  if (partial) return false
                  val search = Regex("^(?:cari|carikan|googling)\\s+(.+)").find(t)
                  if (search != null) {
                      view("https://www.google.com/search?q=" + Uri.encode(search.groupValues[1]))
                      say("Mencari ${search.groupValues[1]}.")
                      return true
                  }
                  val play = Regex("^(?:putar|setel|play)\\s+(.+)").find(t)
                  if (play != null) {
                      view("https://www.youtube.com/results?search_query=" + Uri.encode(play.groupValues[1]))
                      say("Memutar ${play.groupValues[1]} di YouTube.")
                      return true
                  }
                  if (t.contains("matikan robo") || t == "berhenti mendengarkan") {
                      say("Robo dimatikan.")
                      h.postDelayed({ stopSelf() }, 1800L)
                      return true
                  }
                  return false
              }

              private fun wake() {
                  try {
                      val pm = getSystemService(POWER_SERVICE) as PowerManager
                      val wl = pm.newWakeLock(PowerManager.SCREEN_BRIGHT_WAKE_LOCK or PowerManager.ACQUIRE_CAUSES_WAKEUP, "robo:wake")
                      wl.acquire(10000L)
                  } catch (e: Exception) {
                  }
              }

              private fun unlockScreen() {
                  wake()
                  val i = Intent(this, UnlockActivity::class.java)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_NO_ANIMATION)
                  try {
                      startActivity(i)
                  } catch (e: Exception) {
                  }
                  val pi = PendingIntent.getActivity(this, 7, i, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(this, "robo_open")
                      .setSmallIcon(android.R.drawable.ic_lock_idle_lock)
                      .setContentTitle("Buka kunci layar")
                      .setContentText("Ketuk untuk membuka kunci")
                      .setContentIntent(pi)
                      .setFullScreenIntent(pi, true)
                      .setAutoCancel(true)
                      .setTimeoutAfter(8000L)
                      .build()
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(4, n)
              }

              private fun homePkg(): String? =
                  packageManager.resolveActivity(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), PackageManager.MATCH_DEFAULT_ONLY
                  )?.activityInfo?.packageName

              private fun hasUsage(): Boolean {
                  val ops = getSystemService(APP_OPS_SERVICE) as AppOpsManager
                  val mode = if (Build.VERSION.SDK_INT >= 29) {
                      ops.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName)
                  } else {
                      ops.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), packageName)
                  }
                  return mode == AppOpsManager.MODE_ALLOWED
              }

              private fun foregroundPkg(): String? {
                  val usm = getSystemService(USAGE_STATS_SERVICE) as UsageStatsManager
                  val now = System.currentTimeMillis()
                  val ev = usm.queryEvents(now - 12 * 3600 * 1000L, now)
                  val e = UsageEvents.Event()
                  var cur: String? = null
                  while (ev.hasNextEvent()) {
                      ev.getNextEvent(e)
                      if (e.eventType == UsageEvents.Event.MOVE_TO_FOREGROUND) {
                          cur = e.packageName
                      } else if (e.eventType == UsageEvents.Event.MOVE_TO_BACKGROUND && cur == e.packageName) {
                          cur = null
                      }
                  }
                  val skip = setOf(packageName, homePkg(), "com.android.systemui")
                  return if (cur == null || cur in skip) null else cur
              }

              private fun labelOf(pkg: String): String {
                  return try {
                      packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString()
                  } catch (e: Exception) {
                      pkg
                  }
              }

              private fun goHome() {
                  try {
                      startActivity(Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                  }
              }

              private fun kill(pkg: String) {
                  try {
                      (getSystemService(ACTIVITY_SERVICE) as ActivityManager).killBackgroundProcesses(pkg)
                  } catch (e: Exception) {
                  }
              }

              private fun closeApp(q: String) {
                  val pkg: String
                  val label: String
                  if (q.isEmpty()) {
                      if (!hasUsage()) {
                          say("Aku perlu izin Akses penggunaan untuk tahu aplikasi mana yang terbuka. Aku bukakan pengaturannya.")
                          try {
                              startActivity(Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                          } catch (e: Exception) {
                          }
                          return
                      }
                      val fg = foregroundPkg()
                      if (fg == null) {
                          say("Tidak ada aplikasi yang sedang terbuka.")
                          return
                      }
                      pkg = fg
                      label = labelOf(fg)
                  } else {
                      val hit = Apps.find(this, q)
                      if (hit == null) {
                          say("Aku tidak menemukan aplikasi $q.")
                          return
                      }
                      pkg = hit.second
                      label = hit.first
                  }
                  val needHome = q.isEmpty() || !hasUsage() || foregroundPkg() == pkg
                  if (needHome) goHome()
                  h.postDelayed({ kill(pkg) }, 1200L)
                  h.postDelayed({ kill(pkg) }, 3500L)
                  say("Aplikasi $label ditutup.")
              }

              private fun view(u: String) {
                  try {
                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u)).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                  } catch (e: Exception) {
                  }
              }

              private fun hint(label: String, pkg: String) {
                  val li = packageManager.getLaunchIntentForPackage(pkg) ?: return
                  val pi = PendingIntent.getActivity(this, 5, li, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT)
                  val n = Notification.Builder(this, "robo_open")
                      .setSmallIcon(android.R.drawable.ic_menu_send)
                      .setContentTitle("Buka $label")
                      .setContentText("Ketuk jika aplikasi belum terbuka")
                      .setContentIntent(pi)
                      .setAutoCancel(true)
                      .setTimeoutAfter(8000L)
                      .build()
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).notify(3, n)
              }

              override fun onDestroy() {
                  running = false
                  active = false
                  listener = null
                  speak = null
                  RoboAccessibility.instance?.stopScroll()
                  h.removeCallbacksAndMessages(null)
                  try {
                      rec?.destroy()
                  } catch (e: Exception) {
                  }
                  tts?.shutdown()
                  overlay?.let {
                      try {
                          (getSystemService(WINDOW_SERVICE) as WindowManager).removeView(it)
                      } catch (e: Exception) {
                      }
                  }
                  super.onDestroy()
              }
          }
