                  autoSend = send
                  p(c).edit().putLong("scrollMs", ms).putBoolean("autoSend", send).apply()
              }

              fun micTimings(): Triple<Long, Long, Long> = when (micSens) {
                  0 -> Triple(900L, 700L, 650L)
                  2 -> Triple(450L, 300L, 250L)
                  else -> Triple(700L, 500L, 450L)
              }
          }
