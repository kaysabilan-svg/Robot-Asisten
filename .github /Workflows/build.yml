          package com.kay.robo

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          object Vault {
              private const val ALIAS = "robo_vault"

              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore")
                  ks.load(null)
                  val existing = ks.getKey(ALIAS, null)
                  if (existing is SecretKey) return existing
                  val g = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  g.init(
                      KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build()
                  )
                  return g.generateKey()
              }

              private fun enc(s: String): String {
                  val c = Cipher.getInstance("AES/GCM/NoPadding")
                  c.init(Cipher.ENCRYPT_MODE, key())
                  val iv = c.iv
                  val out = iv + c.doFinal(s.toByteArray(Charsets.UTF_8))
                  return Base64.encodeToString(out, Base64.NO_WRAP)
              }

              private fun dec(s: String): String? {
                  return try {
                      val b = Base64.decode(s, Base64.NO_WRAP)
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, b.copyOfRange(0, 12)))
                      String(c.doFinal(b.copyOfRange(12, b.size)), Charsets.UTF_8)
                  } catch (e: Exception) {
                      null
                  }
              }

              private fun prefs(c: Context) = c.getSharedPreferences("robo_vault", Context.MODE_PRIVATE)

              fun savePin(c: Context, pin: String) {
                  prefs(c).edit().putString("pin", enc(pin)).apply()
              }

              fun saveWord(c: Context, w: String) {
                  val x = w.trim().lowercase()
                  prefs(c).edit().putString("word", if (x.isEmpty()) "" else enc(x)).apply()
              }

              fun has(c: Context): Boolean = !prefs(c).getString("pin", "").isNullOrEmpty()

              fun load(c: Context): String? {
                  val s = prefs(c).getString("pin", "") ?: ""
                  return if (s.isEmpty()) null else dec(s)
              }

              fun word(c: Context): String {
                  val s = prefs(c).getString("word", "") ?: ""
                  return if (s.isEmpty()) "" else (dec(s) ?: "")
              }

              fun clear(c: Context) {
                  prefs(c).edit().clear().apply()
              }
          }
